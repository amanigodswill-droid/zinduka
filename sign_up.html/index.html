<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sign up</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-6 rounded-2xl shadow-md w-96">
        <h2 class="text-2xl font-bold mb-4 text-center">Sign Up</h2>

        <input id="firstName" type="text" placeholder="First Name" class="w-full mb-3 p-2 border rounded" />
        <input id="lastName" type="text" placeholder="Last Name" class="w-full mb-3 p-2 border rounded" />
        <input id="email" type="email" placeholder="Email" class="w-full mb-3 p-2 border rounded" />
        <input id="password" type="password" placeholder="Password" class="w-full mb-3 p-2 border rounded" />

        <button id="signupBtn" class="w-full bg-green-500 text-white p-2 rounded hover:bg-green-600">
            Sign Up
        </button>

        <p class="text-sm text-center mt-4">
            Already have an account?
            <a href="login.html" class="text-blue-500">Login</a>
        </p>

        <p id="message" class="text-center mt-3 text-sm"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
